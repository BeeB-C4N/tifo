name: Build Hokuriku TIFO data

on:
  schedule:
    # 毎週月曜日 03:00 JST（GitHub ActionsのcronはUTC指定）
    - cron: '0 18 * * 0'
  workflow_dispatch:

concurrency:
  group: build-hokuriku-tifo-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout TIFO
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Build lightweight CSV files
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/build_hokuriku_data.py --output-dir data/hokuriku

      - name: Show output sizes
        run: du -h data/hokuriku/* | sort -h

      - name: Commit generated data when changed
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hokuriku
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: rebuild Hokuriku TIFO aggregates ($(date -u +'%Y-%m-%dT%H:%M:%SZ'))"
            git push
          fi
